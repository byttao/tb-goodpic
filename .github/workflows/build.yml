name: 打包

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app
          - name: Windows
            os: windows-latest
            rust-targets: ""
            # 便携版：只编译 exe，不打安装包
            args: --no-bundle
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: 编译
        run: npx tauri build ${{ matrix.args }}

      - name: 制作 DMG（含安装脚本）
        if: runner.os == 'macOS'
        run: bash scripts/macos/make-dmg.sh

      - name: 整理便携版 exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw -Encoding utf8 | ConvertFrom-Json
          New-Item -ItemType Directory -Force dist-win | Out-Null
          Copy-Item src-tauri/target/release/tb-goodpic.exe "dist-win/$($conf.productName)_$($conf.version)_便携版.exe"
          Get-ChildItem dist-win

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: 淘宝图片下载-macOS
          path: dist-mac/*.dmg

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: 淘宝图片下载-Windows
          path: dist-win/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
